baseURL = "https://hydarealman.github.io/yaodong-journal/"
title = "Yaodong’s Journal"
description = "把日常笔记整理成可检索、可归档的个人博客。"
theme = "PaperMod"
locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
timeZone = "Asia/Shanghai"

buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 12

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

[minify]
  disableXML = true
  minifyOutput = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[params]
  env = "production"
  title = "Yaodong’s Journal"
  description = "学习、实践、阅读与生活中的记录。"
  keywords = ["Hugo", "Blog", "Notes", "个人博客", "技术笔记"]
  author = "Yaodong Hong"
  DateFormat = "2006-01-02"
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true
  UseHugoToc = true
  showtoc = true
  tocopen = true
  mainSections = ["posts"]
  comments = true

  [params.giscus]
    repo = "hydarealman/yaodong-journal"
    repoId = "R_kgDOS5PAig"
    category = "General"
    categoryId = "DIC_kwDOS5PAis4DAWkL"
    mapping = "pathname"
    theme = "preferred_color_scheme"
    lang = "zh-CN"
  hideFooter = false

  [params.assets]
    disableHLJS = true

  [params.homeInfoParams]
    Title = "Yaodong’s Journal"
    Content = "学习 · 实践 · 阅读 · 生活"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.35
    minMatchCharLength = 1
    keys = ["title", "permalink", "summary", "content", "tags", "categories"]

  [params.editPost]
    URL = "https://github.com/hydarealman/yaodong-journal/edit/main/content"
    Text = "编辑此页"
    appendFilePath = true

  [params.likeSystem]
    provider = "local"
    supabaseUrl = ""
    supabaseAnonKey = ""
    table = "doc_likes"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hydarealman"

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "github"

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 10
[[menu.main]]
  name = "主题"
  url = "/categories/"
  weight = 20
[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 30
[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 40
