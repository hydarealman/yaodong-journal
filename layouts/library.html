{{ define "main" }}<header class="page-header"><p class="eyebrow">THE COMPLETE INDEX</p><h1>所有记录</h1><p>包含持续更新的长文、简短笔记与尚待展开的条目。</p></header><div class="index-controls"><label>查找文章<input id="index-query" type="search" placeholder="输入标题关键词"></label><label>篇章<select id="index-topic"><option value="">全部篇章</option>{{ range hugo.Data.journal_topics }}<option value="{{ .id }}">{{ .title }}</option>{{ end }}</select></label><p id="index-count" aria-live="polite"></p></div><div id="journal-index">{{ range (where site.RegularPages "Type" "posts").ByDate.Reverse }}{{ $topic := partial "journal_topic.html" . }}<article class="index-row" data-title="{{ lower .Title }}" data-topic="{{ $topic.id }}"><a href="{{ .RelPermalink }}">{{ .Title }}</a><span>{{ $topic.title }}</span></article>{{ end }}</div><p id="index-empty" hidden>没有找到相关文章，可以换个关键词试试。</p><script>(()=>{const q=document.getElementById('index-query'),t=document.getElementById('index-topic'),rows=[...document.querySelectorAll('.index-row')];function filter(){let count=0;for(const row of rows){const show=row.dataset.title.includes(q.value.trim().toLowerCase())&&(!t.value||t.value===row.dataset.topic);row.hidden=!show;if(show)count++}document.getElementById('index-count').textContent=count+' / '+rows.length+' 篇';document.getElementById('index-empty').hidden=count!==0}q.addEventListener('input',filter);t.addEventListener('change',filter);filter()})()</script>{{ end }}
