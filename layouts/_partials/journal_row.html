{{ $topic := partial "journal_topic.html" . }}<article class="note-row"><div class="note-meta">{{ if ge .Date.Year 2000 }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ end }}<a href="{{ printf "topics/%s/" $topic.id | relURL }}">{{ $topic.title }}</a></div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>{{ with .Description }}<p>{{ . | plainify | truncate 100 }}</p>{{ end }}<div class="note-bottom"><span>{{ .ReadingTime }} 分钟阅读</span><a href="{{ .RelPermalink }}" aria-label="阅读：{{ .Title }}">阅读全文 ↗</a></div></article>
